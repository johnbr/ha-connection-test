name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check .
      - name: Run tests
        run: pytest tests/ -v

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax-check the card
        run: node --check custom_components/connection_test/frontend/connection-test-card.js
      # Node's built-in runner — the measurement maths and formatters are pure
      # functions, so they are unit-tested with no npm toolchain.
      - name: Run card tests
        run: node --test tests/test_card.js
